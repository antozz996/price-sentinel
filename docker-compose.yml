version: "2.4"

# ─────────────────────────────────────────────────────────
# PRICE SENTINEL — Docker Compose
# VPS Hetzner CX21 dedicata — PostgreSQL e backend non esposti
# docker-compose v2.4 per compatibilità depends_on + healthcheck
# ─────────────────────────────────────────────────────────

services:

  # ── PostgreSQL 15 ──────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: ps_db
    restart: unless-stopped
    env_file:
      - /etc/price-sentinel/postgres.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ps_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ps_backend
    restart: unless-stopped
    env_file:
      - /etc/price-sentinel/backend.env
    volumes:
      - ./backend:/app
    networks:
      - ps_internal
    expose:
      - "8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Nginx HTTP interno; Caddy è l'unico terminatore TLS ──
  nginx:
    image: nginx:alpine
    container_name: ps_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      - ps_internal
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
    driver: local

networks:
  ps_internal:
    driver: bridge
