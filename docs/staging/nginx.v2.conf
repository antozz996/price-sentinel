# Staging V2 ONLY. Reach this Nginx solely through the host-loopback
# port + SSH tunnel. No production domains or backends are allowed.
worker_processes 1;
pid /tmp/nginx-v2.pid;
events {
    worker_connections 256;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    sendfile on;
    server_tokens off;
    client_max_body_size 10m;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store" always;

        # External supplier webhooks are forbidden in staging.
        location ^~ /api/v1/webhook {
            return 403;
        }

        # This name resolves ONLY on the isolated V2 Docker bridge.
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 40s;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1h;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
