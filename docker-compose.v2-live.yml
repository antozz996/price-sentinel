# PRICE SENTINEL V2 — live promotion override.
# Apply after the isolated V2 stack has passed its staging smoke tests:
#   docker compose -p price_sentinel_v2 \
#     -f docker-compose.v2-staging.yml \
#     -f docker-compose.v2-staging-web.yml \
#     -f docker-compose.v2-live.yml up -d --no-deps --force-recreate backend web
#
# The live operational monitor is enabled. It creates deduplicated alerts only;
# supplier communications still require explicit operator actions and configured
# provider credentials.
services:
  backend:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      AUTOMATION_ENABLED: "true"
      # Price check restarted on 2026-11-06 (user decision): invoices uploaded
      # before this moment no longer create anomalies.
      ANOMALY_CHECK_START: "2026-11-06T18:00:00+00:00"
    command:
      - sh
      - -ec
      - >
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
