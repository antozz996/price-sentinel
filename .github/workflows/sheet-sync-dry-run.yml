name: Google Sheets Multi-Sector Dry Run

on:
  push:
    branches:
      - feat/google-sheets-multisheet-dry-run
  pull_request:
    paths:
      - "backend/app/services/sheet_sync_*.py"
      - "backend/scripts/sheet_sync_preview.py"
      - "backend/tests/test_sheet_sync_dry_run.py"
      - "backend/tests/test_sheet_sync_google_auth.py"
      - "backend/tests/fixtures/sheets_sync_synthetic.json"
      - "backend/requirements.txt"
      - ".github/workflows/sheet-sync-dry-run.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-sector-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+asyncpg://readonly:unused@127.0.0.1:5432/dummy_test_only
      SECRET_KEY: "sheets-test-not-a-production-secret-12345678"
      ARUBA_WEBHOOK_API_KEY: "fake-test"
      LIQUIDSTOCK_INTEGRATION_SECRET: "test-only-compatibility-value-1234567890"
      ENVIRONMENT: "test"
      AUTOMATION_ENABLED: "false"
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile reader and CLI
        run: python -m compileall -q backend/app/services/sheet_sync_dry_run.py backend/app/services/sheet_sync_google.py backend/scripts/sheet_sync_preview.py backend/tests/test_sheet_sync_dry_run.py backend/tests/test_sheet_sync_google_auth.py
      - name: Verify sector schemas, exclusions and fail-closed policies
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_sheet_sync_dry_run.py' -v
      - name: Verify keyless Google ADC and ID validation (offline mocks)
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_sheet_sync_google_auth.py' -v
      - name: Dry-run synthetic fixture; assert zero write paths
        working-directory: backend
        run: PYTHONPATH=. python scripts/sheet_sync_preview.py --fixture tests/fixtures/sheets_sync_synthetic.json --show-samples 2

# This workflow uses synthetic rows only. It never receives Google credentials,
# never reads the live workbook, never contacts the production database, and
# never commits prices.
