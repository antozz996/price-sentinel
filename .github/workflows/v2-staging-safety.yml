name: Price Sentinel V2 Staging Isolation

on:
  push:
    branches:
      - staging/price-sentinel-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-isolation-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout V2 staging
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline validation dependencies only
        run: python -m pip install 'SQLAlchemy==2.0.35' 'PyYAML==6.0.3' 'pydantic[email]==2.9.2'
      - name: Unit test deny-by-default staging database guard
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_v2_staging_isolation.py' -v
      - name: Regression check staging admin login email validation
        env:
          PYTHONPATH: backend
        run: |
          python - <<'PY'
          from pathlib import Path
          from pydantic import ValidationError
          from app.schemas.utenti import UtenteLogin

          UtenteLogin(email="staging-admin@example.com", password="test-value")
          try:
              UtenteLogin(email="staging-admin@pricesentinel.local", password="test-value")
          except ValidationError:
              pass
          else:
              raise AssertionError("Pydantic unexpectedly accepted .local email")
          bootstrap = Path("backend/scripts/create_v2_staging_admin.py").read_text()
          repair = Path("backend/scripts/repair_v2_staging_admin.py").read_text()
          assert 'email = "staging-admin@example.com"' in bootstrap
          assert 'NEW_EMAIL = "staging-admin@example.com"' in repair
          assert 'validate(dict(os.environ))' in repair
          assert 'getpass.getpass(' in repair
          app = Path("frontend/src/App.tsx").read_text()
          assert 'Array.isArray(detail)' in app
          assert "message = issues.join(" in app
          print("PASS: staging admin email and readable auth validation errors")
          PY
      - name: Verify safe staging redeploy scripts without execution
        run: |
          bash -n scripts/deploy_v2_staging_safe.sh
          python -m compileall -q backend/scripts/smoke_v2_staging.py
          python - <<'PY'
          from pathlib import Path
          deploy = Path("scripts/deploy_v2_staging_safe.sh").read_text()
          smoke = Path("backend/scripts/smoke_v2_staging.py").read_text()
          assert "docker compose" in deploy
          assert "ps_backend ps_db" in deploy
          assert "config --format json" in deploy
          assert "127.0.0.1:18084" in deploy
          assert "up -d --no-deps --build --force-recreate" in deploy
          assert "scripts.smoke_v2_staging" in deploy
          assert "git -C \"$ROOT\" rev-parse HEAD" in deploy
          assert "docker compose down" not in deploy
          assert "docker system prune" not in deploy
          assert "docker volume prune" not in deploy
          assert "docker exec" in smoke or "async_session_factory" in smoke
          assert "validate(dict(os.environ))" in smoke
          assert "client.get(" in smoke
          assert "client.post(" not in smoke
          assert "client.put(" not in smoke
          assert "client.patch(" not in smoke
          assert "client.delete(" not in smoke
          print("PASS: redeploy script is scoped to V2, and API smoke is GET-only")
          PY
      - name: Test normalized Compose JSON using disposable CI secrets
        run: |
          sudo mkdir -p /etc/price-sentinel-v2
          sudo python3 - <<'PY'
          from pathlib import Path
          from secrets import token_urlsafe
          root=Path("/etc/price-sentinel-v2")
          pwd=token_urlsafe(40)
          (root/"postgres.env").write_text(chr(10).join([
              "POSTGRES_USER=ps_v2_app",
              "POSTGRES_DB=price_sentinel_v2_staging",
              f"POSTGRES_PASSWORD={pwd}",
              "",
          ]))
          (root/"backend.env").write_text(chr(10).join([
              "ENVIRONMENT=staging",
              "DEBUG=false",
              "AUTOMATION_ENABLED=false",
              f"DATABASE_URL=postgresql+asyncpg://ps_v2_app:{pwd}@db:5432/price_sentinel_v2_staging",
              f"SECRET_KEY={token_urlsafe(48)}",
              f"ARUBA_WEBHOOK_API_KEY={token_urlsafe(32)}",
              f"LIQUIDSTOCK_INTEGRATION_SECRET={token_urlsafe(48)}",
              "",
          ]))
          PY
          docker compose -p price_sentinel_v2 \
            -f docker-compose.v2-staging.yml \
            -f docker-compose.v2-staging-web.yml config -q
          docker compose -p price_sentinel_v2 \
            -f docker-compose.v2-staging.yml \
            -f docker-compose.v2-staging-web.yml config --format json | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          s=d["services"]
          assert set(s)=={"db","backend","web"}
          assert set(s["db"]["networks"])=={"v2_internal"}, s["db"]["networks"]
          assert set(s["backend"]["networks"])=={"v2_internal"}, s["backend"]["networks"]
          assert set(s["web"]["networks"])=={"v2_internal","v2_ingress"}, s["web"]["networks"]
          assert d["networks"]["v2_internal"]["internal"] is True
          assert len(s["web"]["ports"])==1
          assert all(p["host_ip"]=="127.0.0.1" and str(p["published"])=="18084" and p["target"]==80 for p in s["web"]["ports"])
          assert not s["db"].get("ports") and not s["backend"].get("ports")
          assert str(s["backend"]["environment"]["AUTOMATION_ENABLED"]).lower() in ("false","0")
          assert str(s["backend"]["environment"]["ENVIRONMENT"]).lower()=="staging"
          print("PASS: Docker Compose normalized network shape and staging port isolation")
          '
      - name: Assert tenant-scoped KPI joins and safe smoke diagnostics
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          src=Path("backend/app/api/v1/intelligence.py").read_text()
          module=ast.parse(src)
          matches=[n for n in module.body if isinstance(n,ast.AsyncFunctionDef) and n.name=="get_kpi"]
          assert len(matches)==1
          snippet=ast.get_source_segment(src,matches[0])
          assert snippet is not None
          assert "Anomalia.tenant_id" not in snippet
          assert "NotaDiCredito.tenant_id" not in snippet
          assert snippet.count(".join(RigaFattura, Anomalia.riga_fattura_id == RigaFattura.id)") == 2
          assert snippet.count(".join(Fattura, RigaFattura.fattura_id == Fattura.id)") == 2
          assert snippet.count(".where(Fattura.tenant_id == tenant_id)") == 2
          assert 'raise HTTPException(status_code=403' in snippet
          smoke=Path("backend/scripts/smoke_v2_staging.py").read_text()
          assert "time.monotonic()" in smoke
          assert 'type(exc).__name__' in smoke
          assert "httpx.Limits(max_keepalive_connections=0)" in smoke
          print("PASS: KPI scopes through invoices, no invalid tenant columns, probe errors classified")
          PY
      - name: Typecheck and build V2 frontend (no deploy)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install V2 frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Verify frontend production bundle
        run: npm run build
        working-directory: frontend
      - name: Check dangerous defaults and unverifiable dashboard claims
        run: |
          python - <<'PY'
          from pathlib import Path
          god = Path("backend/app/api/v1/god_mode.py").read_text()
          assert 'os.getenv("GOD_MODE_TOKEN", "")' in god
          assert "require_god_token_configured()" in god
          assert "hmac.compare_digest" in god
          assert "sentinel_god_master_key" not in god
          assert '"token": GOD_MODE_TOKEN' not in god
          god_ui = Path("frontend/src/components/GodModeControlRoom.tsx").read_text()
          assert "sentinel_god_master_key" not in god_ui
          assert "params.get('token')" not in god_ui
          assert "sessionStorage.setItem('god_mode_token'" not in god_ui
          assert "sessionStorage.getItem('god_mode_token'" not in god_ui
          dashboard = Path("frontend/src/components/Dashboard.tsx").read_text()
          assert "Dati dashboard non disponibili" in dashboard
          assert "setLoadError(" in dashboard
          assert "7.4%" not in dashboard
          assert "100% Audit" not in dashboard
          assert "* 12" not in dashboard
          css = Path("frontend/src/index.css").read_text()
          assert "max-width: min(100%, 420px) !important;" in css
          print("PASS: restricted SuperAdmin, honest dashboard and responsive header")
          PY
      - name: Assert Compose isolation and Vercel no-prod-proxy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          compose = yaml.safe_load(Path("docker-compose.v2-staging.yml").read_text())
          assert compose["name"] == "price_sentinel_v2"
          assert compose["services"]["db"]["healthcheck"]["test"] == [
              "CMD-SHELL", "pg_isready -U ps_v2_app -d price_sentinel_v2_staging"
          ], "Healthcheck must not interpolate missing host env vars"
          assert compose["networks"]["v2_internal"]["internal"] is True
          assert 0 < compose["services"]["db"]["cpus"] <= 0.75
          assert 0 < compose["services"]["backend"]["cpus"] <= 1.5
          assert str(compose["services"]["db"]["mem_limit"]).lower() == "768m"
          assert str(compose["services"]["backend"]["mem_limit"]).lower() == "1500m"
          assert set(compose["services"]) == {"db", "backend"}
          assert set(compose["volumes"]) == {"v2_pgdata"}
          for service in compose["services"].values():
              assert not service.get("ports"), "No V2 public or host port is allowed"
              assert service["networks"] == ["v2_internal"]
              assert all("/etc/price-sentinel-v2/" in p for p in service["env_file"])
          backend = compose["services"]["backend"]
          assert backend["environment"]["ENVIRONMENT"] == "staging"
          assert backend["environment"]["AUTOMATION_ENABLED"] == "false"
          assert "ensure_v2_staging.py" in " ".join(backend["command"])
          assert "pgdata" not in str(compose["services"]["backend"].get("volumes", []))
          # Optional private V2 web overlay can bind only loopback, never production.
          web_overlay = yaml.safe_load(Path("docker-compose.v2-staging-web.yml").read_text())
          web = web_overlay["services"]["web"]
          assert web["ports"] == ["127.0.0.1:18084:80"]
          assert web["networks"] == ["v2_internal", "v2_ingress"]
          assert web_overlay["networks"]["v2_ingress"]["driver"] == "bridge"
          assert "internal" not in web_overlay["networks"]["v2_ingress"]
          assert "v2_ingress" not in compose["services"]["db"]["networks"]
          assert "v2_ingress" not in compose["services"]["backend"]["networks"]
          assert not web_overlay["services"].get("db")
          assert not web_overlay["services"].get("backend")
          assert web["depends_on"]["backend"]["condition"] == "service_healthy"
          assert web["cpus"] <= 0.25
          assert str(web["mem_limit"]).lower() == "128m"
          nginx = Path("docs/staging/nginx.v2.conf").read_text()
          assert "proxy_pass http://backend:8000;" in nginx
          assert "location ^~ /api/v1/webhook" in nginx
          assert "guadagnarefacileonline.it" not in nginx
          assert "46.225.81.66" not in nginx
          admin_bootstrap = Path("backend/scripts/create_v2_staging_admin.py").read_text()
          assert "from scripts.ensure_v2_staging import validate" in admin_bootstrap
          assert "getpass.getpass(" in admin_bootstrap
          vercel = json.loads(Path("vercel.json").read_text())
          assert not vercel.get("rewrites"), "Staging frontend must not proxy V1 backend"
          assert not vercel.get("redirects"), "Staging frontend must not redirect to V1"
          frontend_api = Path("frontend/src/api.ts").read_text()
          assert "export const API_BASE = '/api/v1';" in frontend_api
          print("PASS: V2 isolation, no host ports, no production API proxy")
          PY

# No Vercel or Hetzner deployment and no database connection in this workflow.
