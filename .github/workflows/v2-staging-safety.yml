name: Price Sentinel V2 Staging Isolation

on:
  push:
    branches:
      - staging/price-sentinel-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-isolation-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout V2 staging
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline validation dependencies only
        run: python -m pip install 'SQLAlchemy==2.0.35' 'PyYAML==6.0.3'
      - name: Unit test deny-by-default staging database guard
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_v2_staging_isolation.py' -v
      - name: Assert Compose isolation and Vercel no-prod-proxy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          compose = yaml.safe_load(Path("docker-compose.v2-staging.yml").read_text())
          assert compose["name"] == "price_sentinel_v2"
          assert compose["networks"]["v2_internal"]["internal"] is True
          assert set(compose["services"]) == {"db", "backend"}
          assert set(compose["volumes"]) == {"v2_pgdata"}
          for service in compose["services"].values():
              assert not service.get("ports"), "No V2 public or host port is allowed"
              assert service["networks"] == ["v2_internal"]
              assert all("/etc/price-sentinel-v2/" in p for p in service["env_file"])
          backend = compose["services"]["backend"]
          assert backend["environment"]["ENVIRONMENT"] == "staging"
          assert backend["environment"]["AUTOMATION_ENABLED"] == "false"
          assert "ensure_v2_staging.py" in " ".join(backend["command"])
          assert "pgdata" not in str(compose["services"]["backend"].get("volumes", []))
          vercel = json.loads(Path("vercel.json").read_text())
          assert not vercel.get("rewrites"), "Staging frontend must not proxy V1 backend"
          assert not vercel.get("redirects"), "Staging frontend must not redirect to V1"
          frontend_api = Path("frontend/src/api.ts").read_text()
          assert "export const API_BASE = '/api/v1';" in frontend_api
          print("PASS: V2 isolation, no host ports, no production API proxy")
          PY

# No Vercel or Hetzner deployment and no database connection in this workflow.
