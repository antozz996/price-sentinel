name: Price Sentinel V2 — Disposable PostgreSQL E2E

on:
  push:
    branches:
      - staging/price-sentinel-v2
    paths:
      - 'backend/**'
      - 'frontend/src/components/SupplierPriceForms.tsx'
      - 'frontend/src/components/SmartPriceSheet.tsx'
      - 'frontend/e2e/navigation.smoke.spec.ts'
      - '.github/workflows/v2-ephemeral-e2e.yml'
  pull_request:
    branches:
      - main
      - staging/price-sentinel-v2
    paths:
      - 'backend/**'
      - 'frontend/src/components/SupplierPriceForms.tsx'
      - 'frontend/src/components/SmartPriceSheet.tsx'
      - 'frontend/e2e/navigation.smoke.spec.ts'
      - '.github/workflows/v2-ephemeral-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # This PostgreSQL service exists ONLY within the disposable GitHub runner,
    # never on Hetzner. No production/staging secrets or services are used.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ps_ci_runner
          POSTGRES_PASSWORD: github_runner_ephemeral_db_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ps_ci_runner -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      CI: "true"
      CI_POSTGRES_ADMIN_DSN: postgresql+psycopg2://ps_ci_runner:github_runner_ephemeral_db_only@127.0.0.1:5432/postgres
      PYTHONPATH: ${{ github.workspace }}/backend
      # Purely synthetic test config — intentionally never provided by V1/V2.
      DATABASE_URL: postgresql+asyncpg://ps_ci_runner:github_runner_ephemeral_db_only@127.0.0.1:5432/postgres
      SECRET_KEY: ci_only_dummy_jwt_secret_not_for_live_service_2026
      ARUBA_WEBHOOK_API_KEY: synthetic_ci_only_webhook_disabled
      LIQUIDSTOCK_INTEGRATION_SECRET: synthetic_ci_only_bridge_secret_no_real_bridge_1234567890
      ENVIRONMENT: ci
      DEBUG: "false"
      AUTOMATION_ENABLED: "false"
      GOD_MODE_TOKEN: ""

    steps:
      - name: Checkout V2 staging
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install runtime dependencies (no infrastructure deployment)
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Verify normalized Google Sheet package semantics with synthetic rows
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_normalized_google_sheet.py' -v

      - name: Validate isolation of E2E harness
        run: |
          python -m compileall -q backend/scripts/run_ci_disposable_e2e.py
          python - <<'PY'
          from pathlib import Path
          s = Path('backend/scripts/run_ci_disposable_e2e.py').read_text()
          assert 'GITHUB_ACTIONS' in s and 'github-hosted' in s
          assert 'u.host != "127.0.0.1"' in s
          assert 'u.username != "ps_ci_runner"' in s
          assert 'ps_ci_disposable_' in s
          assert 'original_url.set' in s
          assert 'AUTOMATION_ENABLED": "false"' in s
          assert 'GOD_MODE_TOKEN": ""' in s
          assert 'subprocess.run(' in s
          assert 'CREATE DATABASE' in s
          assert 'DROP DATABASE' not in s
          assert 'execute_v1_migration_rehearsal' in s
          migration = Path('backend/alembic/versions/2026_10_23_santo_graal_incomplete_quotes.py').read_text()
          assert 'op.create_table(' in migration
          assert 'supplier_price_form_requests' in migration
          assert 'supplier_price_form_items' in migration
          print("PASS: E2E targets only CI disposable databases")
          PY

      - name: Unit — Anomaly materiality policy and invoice endpoints
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_anomaly_policy.py' -v

      - name: Unit - Import integrity (one invoice per XML, unique index, TD08)
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_integrita_importazione.py' -v

      - name: Unit - Shared purchase lines base (sign, net, units, conversion factor)
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_purchase_lines.py' -v
      - name: Unit - Invoices, commercial agreements and price list from invoices (signed credit notes, invoiced price, units)
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_analisi_spesa.py' -v

      - name: Unit - Dashboard waste and leaderboard (reference per unit, listino at row date, no credit notes)
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_variance_loss.py' -v

      - name: Unit - Consumption and top products (credit notes, units, Excel equals screen, POST selection)
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_consumption_report.py' -v

      - name: Unit - Disputes, credit notes (TD04/TD08), monitor and anomaly KPI
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_contestazioni_note_credito.py' -v

      - name: Unit - Price trend per SKU in price-list unit and dispute dossier from anomalies
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_trend_dossier.py' -v

      - name: Unit - Orders, order/invoice reconciliation, God Mode volume, product reviews
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_analisi_ordini.py' -v

      - name: Unit - Re-link and approval keep worked anomalies
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_refresh_line_anomaly.py' -v

      - name: Unit — Price normalization for pack units
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_price_normalization.py' -v

      - name: Unit - Volume read from product names and no automatic link by name similarity
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_volume_matching_guards.py' -v

      - name: Unit - Catalog guards (allowed units, required category, duplicate check)
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_catalog_guards.py' -v

      - name: Unit - Comparison unit stored in catalogue spelling on imports
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_comparison_unit_catalogue.py' -v

      - name: Unit - Description linked to two products is not a match
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_matching_ambiguous_description.py' -v
      - name: Unit - Weekly price form renewal does not overlap prices
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_offer_renewal.py' -v

      - name: Unit - Minor fixes (normalized supplier choice, price closing, units, worked anomalies, archived suppliers)
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_correzioni_minori.py' -v

      - name: Unit - Listino Smart (converted spot, recommendation, price sheet without unit changes)
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_listino_smart.py' -v

      - name: Unit - Listino Smart sorted by purchases and spend (credit notes, excluded rows)
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_listino_smart_acquisti.py' -v

      - name: Unit - Price origin and single valid price without supplier
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_listino_origine.py' -v

      - name: Unit - Open price list rules (fixed dates, held changes, one pending change per offer)
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_listino_aperto_regole.py' -v

      - name: Unit - Open price list link (public routes without login, admin routes, token)
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_listino_aperto_link.py' -v

      - name: Unit - Open price list activation (changes applied on their date, newer upload wins, invoices rechecked)
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_listino_aperto_attivazione.py' -v

      - name: Unit - Open price list changes page (reminders on the 10th and 25th, yearly impact, admin only)
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_listino_aperto_variazioni.py' -v

      - name: Unit - Open price list office panel (green light, refusal, office price, supplier links)
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_listino_aperto_pannello.py' -v

      - name: Unit - Open price list supplier proposals (own product name, new products, our name never changes)
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_listino_aperto_proposte.py' -v

      - name: Unit - Open price list office decisions on supplier names and new products
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_listino_aperto_proposte_ufficio.py' -v

      - name: Unit - Open price list unit change (supplier proposal, office approval, weekly expiry kept)
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_listino_aperto_unita.py' -v

      - name: Unit - Listino Smart Excel export
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_smart_price_export.py' -v

      - name: Unit — Invoice XML per-unit discounts
        working-directory: backend
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_xml_discounts.py' -v

      - name: Unit — Smart Price Sheet decimal parsing and recommendations
        working-directory: backend
        run: python tests/smart_price_sheet_unit.py

      - name: Unit — Bulk product classification
        working-directory: backend
        run: python tests/product_bulk_classification_unit.py

      - name: Unit — Live suggestions for parked invoice products
        working-directory: backend
        run: python tests/product_work_queue_suggestions_unit.py

      - name: Unit — Order names and promotion rules
        working-directory: backend
        run: python tests/sector_orders_whatsapp_unit.py

      - name: Unit — Signed LiquidStock request security
        working-directory: backend
        run: python tests/liquidstock_auth_unit.py

      - name: Unit — RFQ routing and sector product import
        working-directory: backend
        run: python tests/sector_product_import_and_rfq_test.py

      - name: Unit — comparative supplier preview never writes
        working-directory: backend
        run: python tests/multi_supplier_preview_test.py

      - name: Unit — Google Sheet dry-run without access tokens
        working-directory: backend
        run: python -m unittest discover -s tests -p 'test_sheet_sync_dry_run.py' -v

      - name: Unit — Google Sheets OAuth is mocked and strictly read-only
        working-directory: backend
        run: python -m unittest discover -s tests -p 'test_sheet_sync_google_auth.py' -v

      - name: Unit — New Santo Graal workbook import
        working-directory: backend
        run: python tests/normalized_price_workbook_unit.py

      - name: E2E — Isolated PostgreSQL workflows (writes disposable DBs only)
        run: python backend/scripts/run_ci_disposable_e2e.py --github-ephemeral-only

# No Hetzner, V1 database, V2 staging database or external secrets are present.
# These E2E tests are allowed to write ONLY to service PostgreSQL on this runner.
