# PRICE SENTINEL V2 — physically separate test stack.
# Only launch on an explicitly provisioned staging host / approved Docker daemon.
# DO NOT override with the production docker-compose.yml.
# Required operator-managed files (never store in Git):
#   /etc/price-sentinel-v2/postgres.env
#   /etc/price-sentinel-v2/backend.env
name: price_sentinel_v2

services:
  db:
    image: postgres:15-alpine@sha256:fceb6f86328c36f2438fae3b851b0cc57c4a7e69a58c866d9ce24281f2cf0c9c
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - /etc/price-sentinel-v2/postgres.env
    volumes:
      - v2_pgdata:/var/lib/postgresql/data
    networks:
      - v2_internal
    # No ports: PostgreSQL is inaccessible from the host or the Internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ps_v2_app -d price_sentinel_v2_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: 0.75
    mem_limit: 768m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - /etc/price-sentinel-v2/backend.env
    environment:
      ENVIRONMENT: staging
      DEBUG: "false"
      AUTOMATION_ENABLED: "false"
    command:
      - sh
      - -ec
      - >
        python scripts/ensure_v2_staging.py &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - v2_internal
    expose:
      - "8000"
    # No host ports, proxy, or external webhook until explicitly approved.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    cpus: 1.5
    mem_limit: 1500m
    pids_limit: 384
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  v2_pgdata:
    # Docker Compose project name makes this volume distinct from V1 pgdata.
    driver: local

networks:
  v2_internal:
    driver: bridge
    internal: true
